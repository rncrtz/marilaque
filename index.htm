<script>
// HOVER SOUND FX
const hoverSound = document.getElementById("hoverSound");

document.querySelectorAll(".glass").forEach(div => {
    div.addEventListener("mouseenter", () => {
        hoverSound.currentTime = 0;
        hoverSound.play();
    });
});

// COPY FUNCTION
function copyText(element) {
    navigator.clipboard.writeText(element.innerText)
        .then(() => alert("Copied!"))
        .catch(() => alert("Failed to copy."));
}

// DATE UPDATE
function updateDate() {

    const dateInput = document.getElementById("dateInput").value;

    if (!dateInput) return;

    // SAVE DATE
    localStorage.setItem("savedDate", dateInput);

    const date = new Date(dateInput);

    // FORMATS
    const fullOptions = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    const albumOptions = {
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    // UPDATE POST SECTION
    document.querySelectorAll(".date").forEach(el => {
        el.textContent = date.toLocaleDateString("en-US", fullOptions);
    });

    // UPDATE ALBUM TITLE
    document.querySelectorAll(".album-date").forEach(el => {
        el.textContent = date.toLocaleDateString("en-US", albumOptions);
    });

    // UPDATE ALL PHOTOS
    document.querySelectorAll(".allphotos-date").forEach(el => {
        el.textContent = date.toLocaleDateString("en-US", albumOptions);
    });
}

// SPECIAL THANKS ARRAY
let specialThanksArray = [];

// ADD SPECIAL THANKS
function addSpecialThanks() {

    let value = document.getElementById("thanksInput").value.trim();

    if (!value) return;

    specialThanksArray.push(value);

    document.getElementById("thanksInput").value = "";

    saveSpecialThanks();

    renderSpecialThanks();
}

// REMOVE SPECIAL THANKS
function removeSpecialThanks(index) {

    specialThanksArray.splice(index, 1);

    saveSpecialThanks();

    renderSpecialThanks();
}

// RENDER SPECIAL THANKS
function renderSpecialThanks() {

    const managerContainer = document.getElementById("thanksManager");
    const postContainer = document.getElementById("specialThanksList");

    // CLEAR CONTAINERS
    if (managerContainer) managerContainer.innerHTML = "";
    if (postContainer) postContainer.innerHTML = "";

    // LOOP
    specialThanksArray.forEach((name, index) => {

        let cleanName = name.replace("@", "");

        // POST SECTION
        if (postContainer) {

            postContainer.innerHTML += `
                📷 @${cleanName}<br>
            `;
        }

        // MANAGER SECTION
        if (managerContainer) {

            managerContainer.innerHTML += `
                <div class="thanks-item">
                    <span>${name}</span>
                    <span class="remove-btn" onclick="removeSpecialThanks(${index})">
                        ❌
                    </span>
                </div>
            `;
        }
    });
}

// SAVE SPECIAL THANKS
function saveSpecialThanks() {

    localStorage.setItem(
        "specialThanksList",
        JSON.stringify(specialThanksArray)
    );
}

// LOAD SPECIAL THANKS
function loadSpecialThanks() {

    let saved = localStorage.getItem("specialThanksList");

    if (saved) {

        specialThanksArray = JSON.parse(saved);

        renderSpecialThanks();
    }
}

// PAGE LOAD
window.onload = function () {

    // LOAD SPECIAL THANKS
    loadSpecialThanks();

    // LOAD DATE
    let savedDate = localStorage.getItem("savedDate");

    if (savedDate) {

        document.getElementById("dateInput").value = savedDate;

        updateDate();
    }
};
</script>
